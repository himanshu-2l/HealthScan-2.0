<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1524" />
      <stop offset="50%" stop-color="#070A11" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>

    <!-- Emerald-Cyan Medical Glow Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="25%" stop-color="#2DD4BF" />
      <stop offset="75%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Laser Pulse Ring Gradient -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#070A11" stop-opacity="0" />
    </radialGradient>

    <!-- Multi-stage Biometric Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intenseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Deep Obsidian Titanium Fill -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="502" height="502" x="5" y="5" rx="123" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Ambient Center Core Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#ambientGlow)" />

  <!-- Subtly Etched Biometric Aperture Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2DD4BF" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="10 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#2DD4BF" stroke-opacity="0.12" stroke-width="1.5" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Minimal Signature "H" Biometric Pillars -->
  <!-- Left Pillar -->
  <rect x="122" y="116" width="48" height="280" rx="24" fill="url(#primaryGrad)" filter="url(#softGlow)" />
  <!-- Right Pillar -->
  <rect x="342" y="116" width="48" height="280" rx="24" fill="url(#primaryGrad)" filter="url(#softGlow)" />

  <!-- Central Dynamic Cardiac / Optical Sensor Waveform -->
  <path 
    d="M 170 256 L 210 256 L 230 195 L 256 112 L 282 376 L 306 256 L 342 256" 
    fill="none" 
    stroke="url(#primaryGrad)" 
    stroke-width="22" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#intenseGlow)"
  />

  <!-- High-Precision Biometric Pulse Nodes -->
  <!-- Peak QRS Node -->
  <circle cx="256" cy="112" r="14" fill="#38BDF8" filter="url(#intenseGlow)" />
  <circle cx="256" cy="112" r="6" fill="#FFFFFF" />

  <!-- Base Ventricular Recovery Node -->
  <circle cx="282" cy="376" r="11" fill="#10B981" filter="url(#softGlow)" />
  <circle cx="282" cy="376" r="4.5" fill="#FFFFFF" />

  <!-- Auricular Pre-pulse Node -->
  <circle cx="230" cy="195" r="9" fill="#2DD4BF" />
  <circle cx="230" cy="195" r="3.5" fill="#FFFFFF" />
</svg>
