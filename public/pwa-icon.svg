<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="50%" stop-color="#070A11" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="1" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Inner Subtle Grid -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2DD4BF" stroke-opacity="0.06" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#2DD4BF" stroke-opacity="0.08" stroke-width="2" />

  <!-- Glowing Heart Pulse / ECG Wave Line -->
  <path 
    d="M 110 256 L 180 256 L 205 180 L 235 330 L 265 140 L 295 345 L 320 230 L 340 256 L 402 256" 
    fill="none" 
    stroke="url(#primaryGrad)" 
    stroke-width="16" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Center Biometric Node Rings -->
  <circle cx="265" cy="140" r="10" fill="#2DD4BF" />
  <circle cx="295" cy="345" r="8" fill="#10B981" />
  <circle cx="205" cy="180" r="7" fill="#34D399" />

  <!-- Shield Check Overlay in Top Right -->
  <g transform="translate(350, 60) scale(0.9)">
    <circle cx="30" cy="30" r="28" fill="#132035" stroke="#2DD4BF" stroke-width="2" stroke-opacity="0.4" />
    <path d="M 22 30 L 28 36 L 39 24" fill="none" stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">HEALTHSCAN</text>
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#2DD4BF" text-anchor="middle" letter-spacing="3">CLINICAL PWA</text>
</svg>
