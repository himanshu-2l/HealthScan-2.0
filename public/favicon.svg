<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Squircle Container -->
  <rect width="64" height="64" rx="16" fill="#070A11" />
  <rect width="61" height="61" x="1.5" y="1.5" rx="14.5" fill="none" stroke="url(#favGrad)" stroke-width="1.5" stroke-opacity="0.45" />

  <!-- Architectural "H" Left & Right Biometric Pillars -->
  <rect x="15" y="14" width="6.5" height="36" rx="3.25" fill="url(#favGrad)" />
  <rect x="42.5" y="14" width="6.5" height="36" rx="3.25" fill="url(#favGrad)" />

  <!-- Central Dynamic Cardiac Pulse Wave -->
  <path 
    d="M 21.5 32 L 26.5 32 L 29 24 L 32.5 14 L 36 46 L 39 32 L 42.5 32" 
    fill="none" 
    stroke="url(#favGrad)" 
    stroke-width="3.2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#favGlow)"
  />

  <!-- High-Tech Neon Pulse Node -->
  <circle cx="32.5" cy="14" r="2.5" fill="#38BDF8" />
  <circle cx="36" cy="46" r="1.8" fill="#34D399" />
</svg>
